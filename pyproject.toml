[project]
name = "payment-service"
version = "0.1.0"
description = "Async payment processing service (FastAPI + FastStream + PostgreSQL + RabbitMQ)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "faststream[rabbit]>=0.5.28",
    "granian>=2.8",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.31",
    "uuid6>=2024.7.10",
]

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "mypy>=1.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.6",
    "ty>=0.0.87",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
disallow_untyped_defs = true
exclude = ["src/alembic"]

[[tool.mypy.overrides]]
module = ["faststream.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["src/tests"]
markers = ["integration: tests that require docker containers"]
