name: payment-service

x-app: &app
  build:
    context: ..
    dockerfile: ops/Dockerfile
  env_file:
    - ../.env
  environment: &app-env
    API_HOST: ${API_HOST:-0.0.0.0}
    API_PORT: ${API_PORT:-8000}
    # Цветные консольные логи (dev): always | never | auto
    LOG_COLORS: ${LOG_COLORS:-auto}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    POSTGRES_DB: ${POSTGRES_DB:-payments}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER:-guest}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  depends_on: &app-deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  logging: &app-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker); mount the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payments}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *app-logging

  rabbitmq:
    image: rabbitmq:4.1.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *app-logging

  # One-shot job: applies migrations before any application service starts.
  # Keeps `alembic upgrade head` out of the api startup path, so multiple
  # api replicas never race on schema changes.
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic -c src/alembic.ini upgrade head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["sh", "/ops/entrypoints/api/entry.sh"]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  consumer:
    <<: *app
    command: ["sh", "/ops/entrypoints/consumer/entry.sh"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.entrypoints.consumer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    <<: *app
    command: ["sh", "/ops/entrypoints/relay/entry.sh"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.entrypoints.relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  rabbitmq_data:
